<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>QueryLens</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/input.css" />
  </head>

  <body>
    <header>
      <div class="logo">Query<span>Lens</span></div>
    </header>

    <main>
      <div class="query-form">
        <form>
          <div class="query-header-row">
            <label>クエリ</label>
            <div class="database-type-row">
              <label>DB タイプ</label>
              <select name="databaseType">
                <option value="mysql">MySQL</option>
                <option value="postgresql">PostgreSQL</option>
                <option value="sqlite">SQLite</option>
              </select>
            </div>
          </div>
          <textarea name="query" spellcheck="false"></textarea>
        </form>

        <div class="form-btn-row">
          <button type="button" class="analysis-btn">解析</button>
          <button type="button" class="open-csv-btn">
            解析対象のCSVファイルを選択
          </button>
        </div>

        <div class="query-error"></div>
      </div>
    </main>

    <dialog class="csv-file-dialog">
      <h2>解析対象とするCSVファイルにチェックを入れて下さい</h2>

      <div class="upload-csv-row">
        <input type="file" accept=".csv" class="upload-csv-input" hidden />
        <button type="button" class="select-csv-btn">CSVファイルを選択</button>
        <span class="upload-csv-filename"></span>
        <button type="button" class="upload-csv-btn" disabled>アップロード</button>
      </div>
      <div class="upload-csv-status"></div>

      <div class="csv-file-list"></div>
      <div class="dialog-btn-row">
        <button class="close-btn">閉じる</button>
      </div>
      <div class="dialog-error"></div>
    </dialog>

    <script type="module" src="/js/pages/input/CsvDialog/index.js"></script>
    <script type="module" src="/js/pages/input/Analysis.js"></script>
  </body>
</html>
