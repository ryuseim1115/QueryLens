<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>QueryLens</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/input.css" />
  </head>

  <body>
    <header>
      <div class="logo">Query<span>Lens</span></div>
    </header>

    <main>
      <div class="query-form">
        <form>
          <div class="query-header-row">
            <label>クエリ</label>
            <div class="database-type-row">
              <label>DB タイプ</label>
              <select name="databaseType">
                <option value="mysql">MySQL</option>
                <option value="postgresql">PostgreSQL</option>
                <option value="sqlite">SQLite</option>
              </select>
            </div>
          </div>
          <textarea name="query" spellcheck="false"></textarea>
        </form>

        <div class="form-btn-row">
          <button type="button" class="analysis-btn">解析</button>
          <button type="button" class="open-file-btn">
            解析対象のファイルを選択
          </button>
        </div>

        <div class="query-error"></div>
      </div>
    </main>

    <dialog class="file-dialog">
      <h2>解析対象のファイル一覧</h2>

      <div class="upload-file-row">
        <input type="file" accept=".csv" class="upload-file-input" multiple hidden />
        <button type="button" class="select-file-btn">ファイルを選択</button>
        <span class="upload-file-filename"></span>
        <button type="button" class="upload-file-btn" disabled>アップロード</button>
      </div>
      <div class="upload-file-status"></div>

      <div class="loading-status"></div>
      <div class="file-list"></div>
      <div class="dialog-btn-row">
        <button class="close-btn">閉じる</button>
      </div>
    </dialog>

    <script type="module" src="/js/pages/entries/Input.js"></script>
  </body>
</html>
