<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>新規登録</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/login.css" />
  </head>

  <body>
    <h1>新規登録</h1>
    <form class="register-form">
      <input
        type="text"
        name="username"
        placeholder="ユーザー名"
        class="username-input"
        autocomplete="username"
      />
      <input
        type="password"
        name="password"
        placeholder="パスワード"
        class="password-input"
        autocomplete="new-password"
      />
      <input
        type="password"
        name="password_confirm"
        placeholder="パスワード（確認）"
        class="password-input"
        autocomplete="new-password"
      />
      <button type="button" class="register-btn">登録する</button>
      <div class="register-error"></div>
      <a href="/login" class="register-link">ログインはこちら</a>
    </form>
    <script type="module" src="/js/pages/entries/Register.js"></script>
  </body>
</html>
