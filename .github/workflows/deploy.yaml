name: Deploy to EC2

on:
  push:
    branches: [production]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ~/QueryLens
            git pull origin production
            for i in 1 2 3; do poetry install && break || sleep 10; done
            pkill -f uvicorn || true
            nohup poetry run uvicorn main:app --host 0.0.0.0 --port 8000 > /dev/null 2>&1 &
            disown
